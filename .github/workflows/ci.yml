name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-github-actions-annotate-failures

      - name: Ruff check
        run: ruff check .

      - name: Compile check
        run: python -m py_compile coomi/engine/loop.py && python -m py_compile coomi/engine/loop_runner.py && python -m py_compile coomi/ui/textual_app.py

      - name: Import smoke test
        run: |
          python -c "
          from coomi.ui.events import AgentError, AgentCancelled, TextChunk, ToolStart, ToolDone
          from coomi.engine.loop import AgentLoop, LoopDetector, CancelToken, MAX_ITERATIONS
          from coomi.engine.loop_runner import LoopRunner
          from coomi.engine import AgentLoop, LoopRunner, parse_spec_file
          from coomi.tools.shell.bash import BashTool
          from coomi.tools.shell.powershell import PowerShellTool
          assert MAX_ITERATIONS == 100
          e = AgentError(message='test', is_fatal=False)
          assert e.is_fatal == False
          d = LoopDetector()
          for _ in range(5):
            d.record('bash', {'command': 'ls'})
          assert d.is_stuck() == True
          print('All smoke tests passed!')
          "

      - name: Run tests
        run: pytest --tb=short -q
